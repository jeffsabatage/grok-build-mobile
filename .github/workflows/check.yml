name: check

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node --check server.mjs
          node --check public/app.js
          for f in lib/*.mjs; do node --check "$f"; done
      - run: npm test
